<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>喜宽 · App Store 创意素材</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layer l-glow-main"></div>
    <div class="layer l-glow-corner"></div>
    <div class="layer l-grid"></div>

    <!-- 背景 K 线母题 -->
    <div class="layer l-candles">
      <svg viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true">
        <polyline
          points="40,317 135,305 230,305 325,279 420,272 515,239 610,230 705,201 800,199 895,169 990,146 1085,114"
          fill="none"
          stroke="#e8890c"
          stroke-width="2.5"
          opacity="0.8"
        />
        <g stroke="#e8890c" stroke-width="2" opacity="0.9">
          <line x1="40" y1="292" x2="40" y2="344" />
          <line x1="135" y1="276" x2="135" y2="334" />
          <line x1="230" y1="288" x2="230" y2="322" />
          <line x1="325" y1="250" x2="325" y2="312" />
          <line x1="420" y1="246" x2="420" y2="296" />
          <line x1="515" y1="210" x2="515" y2="266" />
          <line x1="610" y1="206" x2="610" y2="252" />
          <line x1="705" y1="176" x2="705" y2="226" />
          <line x1="800" y1="182" x2="800" y2="216" />
          <line x1="895" y1="142" x2="895" y2="196" />
          <line x1="990" y1="122" x2="990" y2="166" />
          <line x1="1085" y1="86" x2="1085" y2="142" />
        </g>
        <g fill="#e8890c">
          <rect x="32" y="302" width="16" height="30" rx="5" />
          <rect x="127" y="288" width="16" height="34" rx="5" />
          <rect x="222" y="294" width="16" height="22" rx="5" />
          <rect x="317" y="262" width="16" height="34" rx="5" />
          <rect x="412" y="256" width="16" height="32" rx="5" />
          <rect x="507" y="222" width="16" height="34" rx="5" />
          <rect x="602" y="216" width="16" height="28" rx="5" />
          <rect x="697" y="186" width="16" height="30" rx="5" />
          <rect x="792" y="190" width="16" height="18" rx="5" />
          <rect x="887" y="152" width="16" height="34" rx="5" />
          <rect x="982" y="134" width="16" height="24" rx="5" />
          <rect x="1077" y="96" width="16" height="36" rx="5" />
        </g>
      </svg>
    </div>

    <div class="layer l-vignette"></div>

    <div class="stage">
      <div class="copy">
        <div class="brandchip">
          <img src="../../../assets/branding/app_icon.png" alt="" />
          <span>AI 投研助理</span>
        </div>
        <h1>问一句，<br />帮你看懂<span class="amber">行情</span></h1>
        <p class="sub">
          A股<span class="sep">·</span>ETF<span class="sep">·</span>期货 实时行情<span
            class="sep"
            >｜</span
          >AI 分析<span class="sep">｜</span>每日复盘
        </p>
      </div>

      <div class="device">
        <div class="notch"></div>
        <div class="screen">
          <div class="statusbar">
            <span>9:41</span>
            <span class="sb-right">
              <span class="sb-bar" style="height: 0.6vh"></span>
              <span class="sb-bar" style="height: 0.9vh"></span>
              <span class="sb-bar" style="height: 1.2vh"></span>
              <span class="sb-batt"></span>
            </span>
          </div>

          <div class="appbar">
            <img src="../../../assets/branding/app_icon.png" alt="" />
            <span class="appbar-title">AI 助理<small>真实行情数据 · 有据可循</small></span>
          </div>

          <div class="chat">
            <div class="bubble">帮我分析一下沪深 300 最近的成交结构</div>

            <div class="answer">
              <span class="answer-tag">沪深300 · 000300.SH</span>
              <svg class="kline" viewBox="0 0 300 110" preserveAspectRatio="none">
                <line
                  x1="0"
                  y1="52"
                  x2="300"
                  y2="52"
                  stroke="#e2ddd4"
                  stroke-width="1"
                  stroke-dasharray="4 5"
                />
                <g>
                  <line x1="14" y1="72" x2="14" y2="94" stroke="#16a34a" stroke-width="1" />
                  <rect x="10" y="76" width="8" height="13" rx="1.5" fill="#16a34a" />
                  <line x1="40" y1="62" x2="40" y2="88" stroke="#dc2626" stroke-width="1" />
                  <rect x="36" y="66" width="8" height="16" rx="1.5" fill="#dc2626" />
                  <line x1="66" y1="56" x2="66" y2="84" stroke="#dc2626" stroke-width="1" />
                  <rect x="62" y="60" width="8" height="18" rx="1.5" fill="#dc2626" />
                  <line x1="92" y1="44" x2="92" y2="76" stroke="#dc2626" stroke-width="1" />
                  <rect x="88" y="48" width="8" height="20" rx="1.5" fill="#dc2626" />
                  <line x1="118" y1="52" x2="118" y2="82" stroke="#16a34a" stroke-width="1" />
                  <rect x="114" y="58" width="8" height="17" rx="1.5" fill="#16a34a" />
                  <line x1="144" y1="38" x2="144" y2="70" stroke="#dc2626" stroke-width="1" />
                  <rect x="140" y="42" width="8" height="21" rx="1.5" fill="#dc2626" />
                  <line x1="170" y1="30" x2="170" y2="64" stroke="#dc2626" stroke-width="1" />
                  <rect x="166" y="34" width="8" height="23" rx="1.5" fill="#dc2626" />
                  <line x1="196" y1="42" x2="196" y2="70" stroke="#16a34a" stroke-width="1" />
                  <rect x="192" y="46" width="8" height="18" rx="1.5" fill="#16a34a" />
                  <line x1="222" y1="26" x2="222" y2="58" stroke="#dc2626" stroke-width="1" />
                  <rect x="218" y="30" width="8" height="22" rx="1.5" fill="#dc2626" />
                  <line x1="248" y1="18" x2="248" y2="50" stroke="#dc2626" stroke-width="1" />
                  <rect x="244" y="22" width="8" height="24" rx="1.5" fill="#dc2626" />
                  <line x1="274" y1="12" x2="274" y2="44" stroke="#dc2626" stroke-width="1" />
                  <rect x="270" y="16" width="8" height="24" rx="1.5" fill="#dc2626" />
                </g>
                <polyline
                  points="14,84 66,70 118,64 170,44 222,38 274,24"
                  fill="none"
                  stroke="#e8890c"
                  stroke-width="1.6"
                  opacity="0.9"
                />
              </svg>
              <ul class="pts">
                <li>成交额较上周均值放大，量能配合价格上行</li>
                <li>金融与电子板块贡献了主要增量资金</li>
              </ul>
              <div class="answer-foot">行情数据来自第三方数据服务，AI 分析仅供参考</div>
            </div>

            <div class="tools">
              <span>实时行情</span>
              <span>资金流向</span>
              <span>板块数据</span>
            </div>

            <div class="bubble">那同板块里还有哪些值得盯？</div>

            <div class="answer">
              <ul class="pts">
                <li>近 5 日资金净流入居前：电子、非银金融、有色金属</li>
              </ul>
              <div class="answer-foot">已把 3 只标的加入自选，可在「看盘」随时查看</div>
            </div>
          </div>

          <div class="inputbar">
            <span class="ph">问点什么？股票、ETF、期货都可以…</span>
            <span class="send"></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
