<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="喜爱 应用图标">
  <!-- 喜爱 · 纸上墨金
       纸底 + 墨字「喜」+ 墨金四角星。
       四角星是从「喜宽」时期带过来的品牌记号，换的是它所处的世界：
       从深黑底上的亮金黄，落到暖纸上的墨与金。 -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F8F5ED"/>
      <stop offset="0.62" stop-color="#F1EBDD"/>
      <stop offset="1" stop-color="#E7DFCC"/>
    </linearGradient>
    <radialGradient id="corner" cx="0.82" cy="0.16" r="0.55">
      <stop offset="0" stop-color="#C98A3A" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#C98A3A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seal" gradientUnits="userSpaceOnUse" x1="740" y1="180" x2="900" y2="400">
      <stop offset="0" stop-color="#B57B33"/>
      <stop offset="1" stop-color="#8A5316"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#paper)"/>
  <rect width="1024" height="1024" fill="url(#corner)"/>

  <!-- 「喜」：墨色，精确居中（字形框 500 高，横向按实际字宽居中） -->
  <path d="{{XI_PATH}}" transform="translate(249.9,712.1) scale(0.5252,-0.5252)" fill="#1F1C17"/>

  <!-- 品牌记号：四角星 + 一颗小星。放在右上角、躲开字形包围盒，
       这样缩到 29px 也不会糊在笔画上 -->
  <path d="M0,-1 C0.14,-0.26 0.26,-0.14 1,0 C0.26,0.14 0.14,0.26 0,1 C-0.14,0.26 -0.26,0.14 -1,0 C-0.26,-0.14 -0.14,-0.26 0,-1 Z"
        transform="translate(838,188) scale(62)" fill="url(#seal)"/>
  <path d="M0,-1 C0.14,-0.26 0.26,-0.14 1,0 C0.26,0.14 0.14,0.26 0,1 C-0.14,0.26 -0.26,0.14 -1,0 C-0.26,-0.14 -0.14,-0.26 0,-1 Z"
        transform="translate(898,288) scale(28)" fill="#B57B33" fill-opacity="0.9"/>
</svg>
