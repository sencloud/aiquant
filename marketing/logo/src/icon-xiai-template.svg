<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="喜爱 应用图标">
  <!-- 喜爱 · 圆脸小喜
       一个圆滚滚的奶油色小家伙，配一颗墨金四角星（品牌记号沿用「喜宽」时期）。
       全部是基础几何：圆、椭圆、圆头弧线 —— 没有滤镜、没有位图，缩到 29px
       依然是一个「有脸的圆」。 -->
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#FFF6E6"/>
      <stop offset="0.52" stop-color="#FFE4BA"/>
      <stop offset="1" stop-color="#F7C78A"/>
    </linearGradient>
    <radialGradient id="cornerLight" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="0.36" cy="0.28" r="0.92">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#FDF2DE"/>
      <stop offset="1" stop-color="#F5DFBA"/>
    </radialGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B27A38" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#B27A38" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" gradientUnits="userSpaceOnUse" x1="760" y1="250" x2="860" y2="360">
      <stop offset="0" stop-color="#D69A45"/>
      <stop offset="1" stop-color="#9E6322"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#cornerLight)"/>

  <!-- 落在纸上的那一点影子，让小家伙「坐」得住 -->
  <ellipse cx="512" cy="836" rx="212" ry="52" fill="url(#ground)"/>

  <!-- 圆滚滚的身体 -->
  <circle cx="512" cy="522" r="302" fill="url(#body)"/>
  <!-- 左上高光：奶油质感（用径向渐变，别用硬边椭圆 —— 那看着像贴了张白纸） -->
  <ellipse cx="398" cy="360" rx="176" ry="122" fill="url(#gloss)" transform="rotate(-28 398 360)"/>

  <!-- 脸：大眼睛 + 小弧线笑 + 腮红 -->
  <ellipse cx="428" cy="512" rx="27" ry="36" fill="#3D2E20"/>
  <ellipse cx="596" cy="512" rx="27" ry="36" fill="#3D2E20"/>
  <circle cx="419" cy="498" r="10" fill="#FFFFFF" fill-opacity="0.92"/>
  <circle cx="587" cy="498" r="10" fill="#FFFFFF" fill-opacity="0.92"/>
  <ellipse cx="352" cy="586" rx="38" ry="24" fill="#F2957F" fill-opacity="0.42"/>
  <ellipse cx="672" cy="586" rx="38" ry="24" fill="#F2957F" fill-opacity="0.42"/>
  <path d="M466 596 Q512 638 558 596" stroke="#3D2E20" stroke-width="17"
        stroke-linecap="round" fill="none"/>

  <!-- 品牌记号：墨金四角星，浮在右上角 -->
  <path d="M0,-1 C0.14,-0.26 0.26,-0.14 1,0 C0.26,0.14 0.14,0.26 0,1 C-0.14,0.26 -0.26,0.14 -1,0 C-0.26,-0.14 -0.14,-0.26 0,-1 Z"
        transform="translate(806,286) scale(50)" fill="url(#star)"/>
  <path d="M0,-1 C0.14,-0.26 0.26,-0.14 1,0 C0.26,0.14 0.14,0.26 0,1 C-0.14,0.26 -0.26,0.14 -1,0 C-0.26,-0.14 -0.14,-0.26 0,-1 Z"
        transform="translate(870,398) scale(22)" fill="#B57B33" fill-opacity="0.85"/>
</svg>
