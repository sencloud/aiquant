<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="喜爱 应用图标">
  <!-- 喜爱 · 喜 AI
       上下两个**不同底色的区块**，中间那条波浪是它们的交界 —— 不是画在同一块
       底色上的一根线。参考 189 邮箱：上面实蓝放「189」，下面浅蓝白放「5G」，
       交界就是那道波浪。

         上区（暖桃渐变）：喜 + 右上角两颗星
         交界（贯穿全宽的波浪，带一道墨金细线压边）
         下区（米白）：专门画的两色 AI 标记（A 墨、I 墨金）

       波浪走满 0→1024，两端顶到边 —— 既然是区域交界，就不该留内边距。 -->
  <defs>
    <linearGradient id="top" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#FFF6E6"/>
      <stop offset="0.52" stop-color="#FFE4BA"/>
      <stop offset="1" stop-color="#F7C78A"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#FFF3E0"/>
    </linearGradient>
    <radialGradient id="cornerLight" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" gradientUnits="userSpaceOnUse" x1="790" y1="140" x2="890" y2="240">
      <stop offset="0" stop-color="#D69A45"/>
      <stop offset="1" stop-color="#9E6322"/>
    </linearGradient>
  </defs>

  <!-- 下区底色：先铺满，上区再压上去 -->
  <rect width="1024" height="1024" fill="url(#bottom)"/>

  <!-- 上区：从顶部一直到波浪交界 -->
  <path d="M0 0 H1024 V635 Q960 679 896 635 T768 635 T640 635 T512 635 T384 635 T256 635 T128 635 T0 635 Z"
        fill="url(#top)"/>
  <rect width="1024" height="1024" fill="url(#cornerLight)"/>

  <!-- 交界的波浪细线：压在两块底色的接缝上，让分界更利落 -->
  <path d="M0 635 Q64 591 128 635 T256 635 T384 635 T512 635 T640 635 T768 635 T896 635 T1024 635"
        stroke="#B0762A" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- 上区内容：喜 + 两颗星 -->
  <path d="{{XI_PATH}}" transform="translate(312.8,472.1) scale(0.3992,-0.3992)" fill="#3D2E20"/>
  <path d="M0,-1 C0.14,-0.26 0.26,-0.14 1,0 C0.26,0.14 0.14,0.26 0,1 C-0.14,0.26 -0.26,0.14 -1,0 C-0.26,-0.14 -0.14,-0.26 0,-1 Z"
        transform="translate(838,188) scale(54)" fill="url(#star)"/>
  <path d="M0,-1 C0.14,-0.26 0.26,-0.14 1,0 C0.26,0.14 0.14,0.26 0,1 C-0.14,0.26 -0.26,0.14 -1,0 C-0.26,-0.14 -0.14,-0.26 0,-1 Z"
        transform="translate(898,288) scale(24)" fill="#B57B33" fill-opacity="0.9"/>

  <!-- 下区内容：专门画的两色小写 ai 标记（粗笔画 + 斜势）
       a 用几何单层画法（圆腔 + 右侧竖笔），i 是短竖加一点 —— 小写比大写更
       亲切，那个点也顺带成了标记里的一个亮点。 -->
  <g transform="translate(512,842) skewX(-9) translate(-512,-842)">
    <g fill="none" stroke="#3D2E20" stroke-width="42" stroke-linecap="round">
      <circle cx="455" cy="878" r="65"/>
      <path d="M520 813 L520 943"/>
    </g>
    <path d="M630 813 L630 943" stroke="#9E6322" stroke-width="42"
          stroke-linecap="round" fill="none"/>
    <circle cx="630" cy="745" r="24" fill="#9E6322"/>
  </g>
</svg>
