<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="喜爱 Android 自适应图标前景">
  <!-- Android 自适应图标的前景层：只画墨字与记号，底色交给系统（paper）。
       内容全部落在中心 66% 安全区内，圆/方圆/水滴遮罩都不会切到笔画。 -->
  <defs>
    <linearGradient id="fgSeal" gradientUnits="userSpaceOnUse" x1="660" y1="270" x2="790" y2="440">
      <stop offset="0" stop-color="#B57B33"/>
      <stop offset="1" stop-color="#8A5316"/>
    </linearGradient>
  </defs>
  <path d="{{XI_PATH}}" transform="translate(286.7,684.1) scale(0.4517,-0.4517)" fill="#1F1C17"/>
  <path d="M0,-1 C0.14,-0.26 0.26,-0.14 1,0 C0.26,0.14 0.14,0.26 0,1 C-0.14,0.26 -0.26,0.14 -1,0 C-0.26,-0.14 -0.14,-0.26 0,-1 Z"
        transform="translate(700,300) scale(54)" fill="url(#fgSeal)"/>
  <path d="M0,-1 C0.14,-0.26 0.26,-0.14 1,0 C0.26,0.14 0.14,0.26 0,1 C-0.14,0.26 -0.26,0.14 -1,0 C-0.26,-0.14 -0.14,-0.26 0,-1 Z"
        transform="translate(752,396) scale(24)" fill="#B57B33" fill-opacity="0.9"/>
</svg>
