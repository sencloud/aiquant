<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="喜爱 应用图标">
  <!-- 喜爱 · 喜 AI
       构成：墨色「喜」→ 墨金一道波浪 → 墨色「AI」。读出来正好是「喜 AI」，
       也就是「喜爱」这个名字的谐音。
       圆润感来自三处：暖纸底的圆角光晕、波浪的圆头收笔、字母用圆头笔画搭
       （A 是两撇加一横，I 是一竖），没有一处尖角。 -->
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#FFF6E6"/>
      <stop offset="0.52" stop-color="#FFE4BA"/>
      <stop offset="1" stop-color="#F7C78A"/>
    </linearGradient>
    <radialGradient id="cornerLight" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="300" y1="616" x2="724" y2="704">
      <stop offset="0" stop-color="#C88A32"/>
      <stop offset="0.5" stop-color="#A8681F"/>
      <stop offset="1" stop-color="#C88A32"/>
    </linearGradient>
    <linearGradient id="star" gradientUnits="userSpaceOnUse" x1="790" y1="140" x2="890" y2="240">
      <stop offset="0" stop-color="#D69A45"/>
      <stop offset="1" stop-color="#9E6322"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#cornerLight)"/>

  <!-- 喜：墨色，居中偏上。三段式的竖向节奏：127-557 / 625-695 / 762-908，
       间距 68 与 67 基本相等，缩到 29px 也不会糊成一团。 -->
  <path d="M249.0 24.0H763.0V-71.0H249.0ZM160.0 158.0H853.0V-95.0H703.0V64.0H303.0V-95.0H160.0ZM72.0 802.0H928.0V701.0H72.0ZM139.0 676.0H873.0V578.0H139.0ZM35.0 291.0H963.0V183.0H35.0ZM422.0 857.0H570.0V641.0H422.0ZM235.0 335.0 368.0 367.0Q381.7 347.8 392.9 323.4Q404.0 299.0 408.0 279.0L269.0 241.0Q266.0 260.6 256.2 287.5Q246.3 314.3 235.0 335.0ZM622.0 367.0 784.0 347.0Q765.0 316.0 746.0 291.0Q727.0 266.0 713.0 248.0L586.0 272.0Q597.0 295.0 607.0 320.5Q617.0 346.0 622.0 367.0ZM319.0 466.0V432.0H686.0V466.0ZM181.0 553.0H833.0V346.0H181.0Z" transform="translate(286.7,514.0) scale(0.4517,-0.4517)" fill="#3D2E20"/>

  <!-- 波浪：把「喜」和「AI」隔开的那一道水纹，圆头收笔 -->
  <path d="M300 660 Q353 616 406 660 T512 660 T618 660 T724 660"
        stroke="url(#wave)" stroke-width="26" stroke-linecap="round" fill="none"/>

  <!-- AI：墨色，圆头笔画搭出来的两个字 -->
  <g fill="none" stroke="#3D2E20" stroke-width="34" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M413 890 L469 780"/>
    <path d="M525 890 L469 780"/>
    <path d="M437 862 L501 862"/>
    <path d="M618 780 L618 890"/>
  </g>

  <!-- 右上角两颗星：沿用「喜宽」时期的品牌记号，配色跟波浪同一支墨金 -->
  <path d="M0,-1 C0.14,-0.26 0.26,-0.14 1,0 C0.26,0.14 0.14,0.26 0,1 C-0.14,0.26 -0.26,0.14 -1,0 C-0.26,-0.14 -0.14,-0.26 0,-1 Z"
        transform="translate(838,188) scale(54)" fill="url(#star)"/>
  <path d="M0,-1 C0.14,-0.26 0.26,-0.14 1,0 C0.26,0.14 0.14,0.26 0,1 C-0.14,0.26 -0.26,0.14 -1,0 C-0.26,-0.14 -0.14,-0.26 0,-1 Z"
        transform="translate(898,288) scale(24)" fill="#B57B33" fill-opacity="0.9"/>
</svg>
